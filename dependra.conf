# dependra.conf.example — шаблон конфигурации Dependra (S05+)
#
# Канон этого файла: docs/35-configuration/dependra.conf.example
# (в корне репо лежит копия для удобного `cp dependra.conf.example dependra.conf`).
# Скопируйте как `dependra.conf` и раскомментируйте нужное.
# User-конфиг: ~/.config/dependra/dependra.conf
# Явный путь:  dependra <file> --config /path/to/dependra.conf
#
# Диалект: INI-like (.conf). Спека: docs/35-configuration/s05-config.md
# Комментарий: # до конца строки. Секции: [name] / [a.b.c]
# bool: true|false   list: a, b, c   пусто / null: сброс значения
#
# Приоритет (↑): defaults → user → project → profile → --level → CLI

# =============================================================================
# Корень
# =============================================================================

# pathMode = relative
# # name | relative | absolute  (как CLI -p)

# output = text
# # text | json  (как CLI -j)

# defaultProfile =
# # имя профиля из [profiles.*] или пусто

# strict = false
# # true → неизвестные ключи/секции = ошибка

# =============================================================================
# [defaults] — поведение без флагов / слияние
# =============================================================================

# [defaults]
# whenNoFlags = s01-all
# # s01-all  — basic+imports+exports+graph (как S01)
# # none     — ничего не включать автоматически
# # <name>   — имя профиля как неявный defaultProfile

# mergeMode = or
# # пока только or (CLI/ops добавляются к конфигу)

# =============================================================================
# [operations] — операции по умолчанию (имена как в JSON options)
# =============================================================================

# [operations]
# basic = false
# imports = false
# exports = false
# graph = false
# additional = false
# entities = false
# validate = false
# environment = false
# commands = false
# envCheck = false
# runtime = false
# io = false
# mermaid = false
# graphviz = false
# vizJson = false
# metadata = false
# quality = false
# # explain — через CLI -ex или [ai] explain (не обязательно дублировать здесь)

# =============================================================================
# [report] — оформление и поведение вывода
# =============================================================================

# [report]
# format = text
# # text | json  (дубль output; CLI -j сильнее)

# style = schematic
# # schematic | plain

# color = auto
# # auto | always | never

# banner = true
# # баннер dependra в text / help

# sectionOrder = file, imports, exports, graph, additional, entities, diagnostics, environment, commands, env-check, runtime, io, mermaid, graphviz, viz-json, metadata, quality, ai-explain
# # порядок text-секций (неизвестные имена игнор / warning)

# hideSections =
# # пример: hideSections = commands, io

# verbosity = normal
# # quiet | normal | verbose

# unicode = true
# # false → ASCII-рамки вместо box-drawing

# width =
# # целое (колонки) или пусто = auto

# =============================================================================
# [flags.*] — алиасы / rename / disable
# =============================================================================
# Canonical long из спеки CLI всегда принимается.
# Short S01–S05 (-b -i -e -g -j -p -h -v -a -en -va -env -c -ec -r -io -m -gr -vj -me -l -pr -cf) не отбирать.
# S06: -q --quality, -ex --explain
# api-ключи и секреты сюда не писать.

# [flags.aliases]
# --graph = --deps, -D
# --validate = --lint
# --mermaid = --mmd

# [flags.rename]
# --validate = --check
# # новое long-имя; канон --validate остаётся валиден
# # short S01–S04 через rename менять нельзя

# [flags]
# disable =
# # пример: disable = --commands, --io

# =============================================================================
# [profiles.*] — именованные наборы
# =============================================================================

# [profiles.quick.operations]
# basic = true

# [profiles.deps.operations]
# basic = true
# imports = true
# exports = true
# graph = true

# [profiles.deps]
# pathMode = relative
# output = text

# [profiles.validate.operations]
# imports = true
# graph = true
# validate = true

# [profiles.viz.operations]
# graph = true
# mermaid = true
# metadata = true

# [profiles.quality.operations]
# imports = true
# validate = true
# quality = true

# =============================================================================
# [ai] — провайдер (спека S06: docs/20-features/analysis/ai-explain.md)
# =============================================================================
# Ключ API только через переменную окружения (apiKeyEnv), не в этом файле.

 [ai]
 enabled =  true
 provider = openai
  #id адаптера: openai | … (реестр S06)

 baseUrl = https://api.openai.com/v1
# # пусто = default провайдера

 apiKeyEnv = DEPENDRA_AI_API_KEY
 model = gpt-4o-mini
 timeoutMs = 30000
 explain = true
 # true → options.explain (+ OR quality); нужен enabled + ключ в env

# =============================================================================
# Конец шаблона
# =============================================================================
